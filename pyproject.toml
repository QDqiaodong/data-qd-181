[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "data-qd-181"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
astro-stack = "astro_stack.cli:main"
astro-archive = "astro_stack.cli_archive:main"
astro-discovery = "astro_stack.cli_discovery:main"
astro-sky = "astro_stack.cli_sky:main"
astro-release = "astro_stack.cli_release:main"

[tool.setuptools.packages.find]
where = ["src"]
